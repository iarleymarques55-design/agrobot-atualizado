    y="44"
    fill="#074834"
    style="font-family: 'Montserrat', 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 44px; font-weight: 900; font-style: italic; letter-spacing: -0.04em;"
  >
    Agro<tspan fill="#059669">Bot</tspan>
  </text>

